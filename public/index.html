<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Po-ke Mart Fun — TCG Shop</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <span class="brand-mark">PM</span>
        <span>Po-ke Mart Fun</span>
      </a>
      <nav class="nav">
        <a href="/">Shop</a>
        <a href="/cart.html">Cart <span class="badge" data-cart-count hidden>0</span></a>
        <span data-auth-guest>
          <button type="button" class="linkish" data-open-auth="login">Log in</button>
          <button type="button" class="linkish" data-open-auth="register">Register</button>
        </span>
        <span data-auth-user hidden>
          <span class="hint">Hi, <strong data-user-name></strong></span>
          <button type="button" class="linkish" data-logout>Log out</button>
        </span>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Pokemon TCG singles &amp; lots</h1>
      <p>Browse cards, add to cart, and checkout with PayPal, bank card, or Apple Pay. Guest checkout welcome — account optional.</p>
      <div id="mode-banner" class="banner" hidden></div>
    </section>
    <section id="product-grid" class="grid" aria-live="polite"></section>
  </main>

  <footer class="site-footer">
    <div class="container">UK shop demo · Placeholder card art only · Not affiliated with Nintendo / The Pokemon Company</div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/shop.js"></script>
</body>
</html>
