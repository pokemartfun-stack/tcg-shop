<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cart — Po-ke Mart Fun</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <span class="brand-mark">PM</span>
        <span>Po-ke Mart Fun</span>
      </a>
      <nav class="nav">
        <a href="/">Shop</a>
        <a href="/cart.html">Cart <span class="badge" data-cart-count hidden>0</span></a>
        <span data-auth-guest>
          <button type="button" class="linkish" data-open-auth="login">Log in</button>
          <button type="button" class="linkish" data-open-auth="register">Register</button>
        </span>
        <span data-auth-user hidden>
          <span class="hint">Hi, <strong data-user-name></strong></span>
          <button type="button" class="linkish" data-logout>Log out</button>
        </span>
      </nav>
    </div>
  </header>

  <main class="container narrow">
    <section class="hero">
      <h1>Your cart</h1>
      <p>Adjust quantities or continue to checkout. No account required.</p>
      <div id="mode-banner" class="banner" hidden></div>
    </section>

    <div class="panel" id="cart-panel">
      <div id="cart-empty" class="empty" hidden>Your cart is empty. <a href="/">Browse the shop</a>.</div>
      <div id="cart-filled" hidden>
        <table class="cart-table">
          <thead>
            <tr>
              <th>Item</th>
              <th class="hide-sm">Condition</th>
              <th>Qty</th>
              <th>Price</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="cart-body"></tbody>
        </table>
        <div class="cart-summary">
          <div class="subtotal">Subtotal: <span id="cart-subtotal">£0.00</span></div>
          <a class="btn" href="/checkout.html" id="checkout-link">Checkout</a>
          <p class="stock-warn" id="cart-stock-warn" hidden></p>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">UK shop demo · Guest checkout supported</div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/cart-page.js"></script>
</body>
</html>
